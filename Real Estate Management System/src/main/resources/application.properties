spring.application.name=RealEstate
server.port=8080

# ---------- Database ----------
spring.datasource.url=jdbc:mysql://localhost:3306/realestate_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=NewPassword@123

# ---------- Connection pool (HikariCP) ----------
spring.datasource.hikari.pool-name=RealEstateHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ---------- Logging ----------
logging.level.root=INFO
logging.level.com.example=DEBUG


# ---------- JWT ----------
# secret must be at least 32 characters. Change it for any real deployment.
app.jwt.secret=change-this-secret-key-to-a-long-random-value-1234567890

# token validity: 24 hours
app.jwt.expiration-ms=86400000

# ---------- First ADMIN user (created on startup if not present) ----------
app.admin.username=admin
app.admin.password=Admin@123

# ---------- Scheduler (cron: second minute hour day-of-month month day-of-week) ----------
app.scheduler.enabled=true
app.scheduler.expire-leases-cron=0 0 1 * * *
app.scheduler.mark-overdue-cron=0 30 1 * * *
app.scheduler.expiry-reminder-cron=0 0 9 * * *
# For a quick demo, run every minute by using:  0 * * * * *

